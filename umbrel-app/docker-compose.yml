services:

  app_proxy:
    environment:
      APP_HOST: t3code_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/whatanpersonalemail-prog/t3code-umbrel:0.1.7@sha256:a04b05c6b030d97c7e35153333354dad08a93115030670071d505253b73b18a3
    restart: on-failure
    init: true
    environment:
      HOME: /home/t3code
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/t3code
      - ${APP_DATA_DIR}/data/projects:/workspace
    working_dir: /workspace
